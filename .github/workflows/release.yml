name: Build and release

on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    name: Firmware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip python3-venv git unzip curl libusb-1.0-0-dev gcc-arm-none-eabi binutils-arm-none-eabi dfu-util

      - name: Install QMK CLI in a virtual environment
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install qmk

      - name: Clone QMK Firmware
        run: git clone --depth=1 --recursive https://github.com/qmk/qmk_firmware.git

      - name: Copy custom keyboard config into QMK
        run: |
          mkdir -p qmk_firmware/keyboards/jpad_4x4_macropad
          cp -R qmk-config/jpad_4x4_macropad/* qmk_firmware/keyboards/jpad_4x4_macropad/

      - name: Compile firmware
        run: |
          . .venv/bin/activate
          cd qmk_firmware
          qmk compile -kb jpad_4x4_macropad -km default

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: jpad-firmware
          path: qmk_firmware/.build/jpad_4x4_macropad_default.uf2
          include-hidden-files: true
          if-no-files-found: error

  host:
    name: Host (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: ""
          - target: x86_64-apple-darwin
            os: macos-latest
            ext: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: ".exe"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        working-directory: host
        run: cargo build --release --target ${{ matrix.target }}

      - name: Collect the binary
        shell: bash
        working-directory: host
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/jpad${{ matrix.ext }}" \
             "dist/jpad-${{ matrix.target }}${{ matrix.ext }}"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: jpad-host-${{ matrix.target }}
          path: host/dist/jpad-${{ matrix.target }}${{ matrix.ext }}
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - firmware
      - host
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download everything
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: J-Pad ${{ github.ref_name }}
          body: |
            `jpad_4x4_macropad_default.uf2` is the firmware: hold the top left key
            while plugging the board in, then copy the file to the `RPI-RP2` drive.

            The `jpad-<target>` files are the configuration app, run it with no
            arguments for the GUI or with `show`, `verify` or `demo`.
          draft: false
          prerelease: false
          files: release/*
          fail_on_unmatched_files: true
